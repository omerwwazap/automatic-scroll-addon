<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Scroller Controls</title>
    <style>
        body {
            font-family: sans-serif;
            width: 250px; /* Set a fixed width for the popup */
            padding: 15px;
            background-color: #f9f9f9;
            color: #333;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        #speedValue {
            display: inline-block;
            min-width: 30px; /* Ensure space for value */
            text-align: right;
            font-weight: bold;
            color: #005aaa;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            font-size: 14px;
            width: 100%; /* Make button full width */
            box-sizing: border-box; /* Include padding in width */
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.stop-button {
             background-color: #dc3545;
        }
        button.stop-button:hover {
             background-color: #c82333;
        }
        .speed-label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="control-group">
        <div class="speed-label-container">
             <label for="speedSlider">Scroll Speed:</label>
             <span id="speedValue">80</span> </div>
        <input type="range" id="speedSlider" min="1" max="100" value="50">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #666;">
            <span>Slower</span>
            <span>Faster</span>
        </div>
    </div>

    <div class="control-group">
        <button id="toggleButton">Start Scrolling</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
